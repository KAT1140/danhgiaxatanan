<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đăng nhập hệ thống đánh giá công tác Hội xã Tân An." />
    <title>Đăng nhập | Đánh giá công tác Hội Tân An</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=18" />
  </head>
  <body data-page="login">
    <main class="auth-screen">
      <section class="auth-card">
        <span class="brand-logos auth-logos">
          <img src="images/logodoanthanhnien.png" alt="Đoàn Thanh niên Cộng sản Hồ Chí Minh" />
          <img src="images/logothanhnien.png" alt="Hội Liên hiệp Thanh niên Việt Nam" />
        </span>
        <span class="eyebrow">XÃ TÂN AN</span>
        <h1>Đăng nhập hệ thống</h1>
        <p>Dùng tài khoản được quản trị viên cấp cho bạn.</p>
        <form id="login-form">
          <label for="login-username">Tên đăng nhập</label>
          <input id="login-username" name="username" autocomplete="username" required maxlength="64" />
          <label for="login-password">Mật khẩu</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          <p class="auth-error" id="login-error" role="alert" hidden></p>
          <button class="button button-primary auth-submit" id="login-button" type="submit">Đăng nhập</button>
        </form>
        <small class="auth-help" id="auth-help">Mỗi tài khoản thường chỉ được xem và chấm điểm ấp đã gán.</small>
      </section>
    </main>
    <script src="app.js?v=13"></script>
  </body>
</html>
